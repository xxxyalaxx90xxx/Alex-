# XTREME XAI Configuration Template
# © Elektronikx-Center-Matte ® | Entwicklung: Alexander Mathey ©
# 
# Kopiere diese Datei nach ~/.config/xtreme-xai/config.conf und passe sie an

[general]
# Allgemeine Einstellungen
version=4.0.0
installation_date=auto
auto_update=false
language=de

[system]
# System-Einstellungen
install_dir=$HOME/xtreme_ai_system
log_level=info
max_log_size_mb=100
log_retention_days=30

[storage]
# Speicher-Einstellungen
use_sd_card=auto
sd_card_path=/storage/emulated/0/XAI
backup_dir=$HOME/.xtreme-xai-backups
max_backups=10
backup_retention_days=30
auto_backup=false

[performance]
# Performance-Einstellungen
enable_optimizations=true
cpu_governor=auto
swappiness=10
cache_size_mb=500
optimize_on_startup=false

[monitoring]
# Überwachungs-Einstellungen
enable_monitoring=true
update_interval=2
enable_logging=true
log_performance=true

[security]
# Sicherheits-Einstellungen
enable_security_scans=true
scan_interval_hours=24
check_file_permissions=true
monitor_processes=true
alert_on_suspicious=true

[network]
# Netzwerk-Einstellungen
check_connectivity=true
timeout_seconds=5
preferred_dns=8.8.8.8

[emulator]
# Emulator-Einstellungen
emulator_backend=auto
enable_kvm=auto
enable_gpu=true
default_memory_mb=4096
default_cpu_cores=2

[dashboard]
# Dashboard-Einstellungen
enable_web_dashboard=true
dashboard_port=8080
auto_start=false
theme=dark

[notifications]
# Benachrichtigungs-Einstellungen
enable_notifications=false
notify_on_error=true
notify_on_warning=false
notify_on_backup=true

[advanced]
# Erweiterte Einstellungen (Experten)
debug_mode=false
verbose_logging=false
enable_experimental_features=false
